<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polytoria Market Tracker</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0b0b0b; color: #efefef; margin: 0; padding: 0; }
        .hero { background: #161616; padding: 60px 20px; text-align: center; border-bottom: 1px solid #2a2a2a; }
        .hero h1 { margin: 0; font-size: 32px; font-weight: 800; }
        
        /* Filter Bar */
        .filter-bar { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: flex; gap: 10px; justify-content: center; }
        .filter-btn { background: #161616; border: 1px solid #333; color: #888; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .filter-btn.active { background: #007bff; color: white; border-color: #007bff; }
        .filter-btn:hover { border-color: #555; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { 
            background: #161616; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a; 
            text-align: center; text-decoration: none; color: inherit; transition: 0.2s; 
        }
        .card:hover { border-color: #007bff; transform: translateY(-5px); }
        .card img { width: 140px; height: 140px; object-fit: contain; margin-bottom: 15px; }
        .name { font-weight: 700; font-size: 15px; margin-bottom: 8px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price { color: #2ecc71; font-weight: bold; font-size: 17px; }
        .limited-tag { font-size: 10px; color: #f1c40f; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; visibility: hidden; }
        .card.is-limited .limited-tag { visibility: visible; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Market Tracker</h1>
        <p>Advanced item values and analytics.</p>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="load('all', this)">All Items</button>
        <button class="filter-btn" onclick="load('limited', this)">Limiteds Only</button>
    </div>

    <div class="container">
        <div class="grid" id="market-grid"></div>
    </div>

    <script>
        async function load(type, btn) {
            // Update UI buttons
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            const url = type === 'limited' ? '/api/prices?limited=true' : '/api/prices';
            const res = await fetch(url);
            const data = await res.json();
            
            document.getElementById('market-grid').innerHTML = data.map(item => `
                <a href="/store/${item.item_id}" class="card ${item.rap > 0 || item.is_limited ? 'is-limited' : ''}">
                    <span class="limited-tag">Limited</span>
                    <img src="${item.thumbnail}">
                    <div class="name">${item.name}</div>
                    <div class="price">${item.price.toLocaleString()} Bricks</div>
                    <div style="font-size:11px; color:#666; margin-top:5px;">RAP: ${item.rap.toLocaleString()}</div>
                </a>
            `).join('');
        }
        load('all');
    </script>
</body>
</html>
