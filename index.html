<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Tracker</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f9; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 12px; border: 1px solid #ddd; text-align: center; }
        .item-img { width: 100px; height: 100px; object-fit: contain; }
        .view-btn { display: block; margin-top: 10px; padding: 10px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Market Tracker</h1>
    <div class="grid" id="market-grid"></div>

    <script>
        async function load() {
            const res = await fetch('/api/prices');
            const data = await res.json();
            const grid = document.getElementById('market-grid');
            grid.innerHTML = data.map(item => `
                <div class="card">
                    <img src="${item.thumbnail}" class="item-img">
                    <h3>${item.name}</h3>
                    <p>Price: ${item.price}</p>
                    <a href="https://polytoria.com/store/${item.item_id}" target="_blank" class="view-btn">View</a>
                </div>
            `).join('');
        }
        load();
    </script>
</body>
</html>
