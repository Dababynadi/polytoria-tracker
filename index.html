<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polytoria Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0d0d0d; color: #efefef; margin: 0; padding: 0; }
        .navbar { background: #141414; padding: 25px 40px; border-bottom: 1px solid #222; text-align: center; }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: -1px; }
        .logo span { color: #007bff; }

        .search-container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        #search-input { width: 100%; padding: 18px 25px; border-radius: 12px; border: 1px solid #222; background: #141414; color: white; font-size: 16px; outline: none; transition: 0.3s; }
        #search-input:focus { border-color: #007bff; box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1); }

        .container { max-width: 1200px; margin: auto; padding: 0 20px 100px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .card { 
            background: #141414; border: 1px solid #222; border-radius: 16px; padding: 20px; 
            text-align: center; text-decoration: none; color: inherit; transition: 0.2s;
        }
        .card:hover { border-color: #444; transform: translateY(-5px); }
        .card img { width: 100%; border-radius: 10px; margin-bottom: 15px; background: #0d0d0d; padding: 10px; box-sizing: border-box; }
        .card .name { font-weight: 700; display: block; margin-bottom: 8px; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card .price { color: #2ecc71; font-weight: 800; font-size: 14px; }
        .card .id-tag { font-size: 11px; color: #444; display: block; margin-top: 8px; font-weight: 700; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">POLYTORY<span>ARCHIVE</span></div>
    </div>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search by item name..." oninput="handleSearch()">
    </div>

    <div class="container">
        <div class="grid" id="market-grid"></div>
    </div>

    <script>
        let timer;
        function handleSearch() {
            clearTimeout(timer);
            timer = setTimeout(fetchData, 300);
        }

        async function fetchData() {
            const search = document.getElementById('search-input').value;
            const res = await fetch(`/api/prices?search=${encodeURIComponent(search)}`);
            const data = await res.json();
            
            const grid = document.getElementById('market-grid');
            if (data.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#444; margin-top:50px;">No items found in archive.</p>';
                return;
            }

            grid.innerHTML = data.map(item => `
                <a href="/store/${item.item_id}" class="card">
                    <img src="${item.thumbnail}" onerror="this.src='https://polytoria.com/assets/img/icon.png'">
                    <span class="name">${item.name}</span>
                    <span class="price">${item.price.toLocaleString()} Bricks</span>
                    <span class="id-tag">#${item.item_id}</span>
                </a>
            `).join('');
        }
        fetchData();
    </script>
</body>
</html>
