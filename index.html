<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyTracker | Market</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f9; color: #333; margin: 0; }
        nav { background: #fff; padding: 1rem 2rem; border-bottom: 2px solid #e0e6ed; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; color: #007bff; font-size: 1.5rem; }
        .container { padding: 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .item-card { background: white; border-radius: 12px; padding: 1.5rem; border: 1px solid #e0e6ed; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .item-card:hover { transform: translateY(-3px); }
        .item-name { font-weight: 600; margin-bottom: 10px; display: block; }
        .price { color: #007bff; font-weight: bold; font-size: 1.3rem; }
        .rap { color: #888; font-size: 0.85rem; margin-top: 5px; }
    </style>
</head>
<body>
    <nav><div class="logo">PolyTracker</div></nav>
    <div class="container" id="item-list">Loading market data...</div>

    <script>
        async function loadPrices() {
            try {
                const res = await fetch('/api/prices');
                const data = await res.json();
                const list = document.getElementById('item-list');
                list.innerHTML = '';
                data.forEach(item => {
                    list.innerHTML += `
                        <div class="item-card">
                            <span class="item-name">${item.name}</span>
                            <div class="price">${item.price.toLocaleString()} Bricks</div>
                            <div class="rap">RAP: ${item.rap.toLocaleString()}</div>
                        </div>
                    `;
                });
            } catch (e) {
                document.getElementById('item-list').innerText = "Failed to load prices.";
            }
        }
        loadPrices();
    </script>
</body>
</html>
