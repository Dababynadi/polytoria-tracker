<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Archive</title>
    <style>
        body { font-family: sans-serif; background: #080808; color: #efefef; margin: 0; padding: 0; }
        .nav { background: #111; padding: 25px; text-align: center; border-bottom: 1px solid #222; }
        .nav h1 { margin: 0; font-size: 24px; letter-spacing: -1px; }

        .search-container { max-width: 600px; margin: 30px auto; padding: 0 20px; }
        #search-input { width: 100%; padding: 18px; border-radius: 12px; border: 1px solid #222; background: #141414; color: white; font-size: 16px; box-sizing: border-box; }
        
        .filters { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .btn { background: #141414; border: 1px solid #222; color: #666; padding: 12px 25px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .btn.active { background: #fff; color: #000; border-color: #fff; }

        .container { max-width: 1200px; margin: auto; padding: 0 20px 100px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .card { 
            background: #111; border: 1px solid #222; border-radius: 16px; padding: 20px; 
            text-align: center; text-decoration: none; color: inherit; transition: 0.2s;
        }
        .card:hover { border-color: #444; transform: translateY(-5px); background: #161616; }
        .card img { width: 100%; border-radius: 10px; margin-bottom: 15px; filter: grayscale(0.3); }
        .card .name { font-weight: bold; display: block; margin-bottom: 5px; }
        .card .id-tag { font-size: 11px; color: #444; font-family: monospace; }
        
        .offline-badge { font-size: 10px; color: #ff4444; border: 1px solid #ff4444; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>

    <div class="nav">
        <h1>ASSET<span>ARCHIVE</span></h1>
    </div>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Find offline items..." oninput="handleSearch()">
    </div>

    <div class="filters">
        <button class="btn active" id="btn-all" onclick="setMode('all')">All Assets</button>
        <button class="btn" id="btn-lim" onclick="setMode('limited')">Legacy Limiteds</button>
    </div>

    <div class="container">
        <div class="grid" id="asset-grid"></div>
    </div>

    <script>
        let mode = 'all';
        let timer;

        function setMode(m) {
            mode = m;
            document.getElementById('btn-all').classList.toggle('active', m === 'all');
            document.getElementById('btn-lim').classList.toggle('active', m === 'limited');
            fetchItems();
        }

        function handleSearch() {
            clearTimeout(timer);
            timer = setTimeout(fetchItems, 300);
        }

        async function fetchItems() {
            const search = document.getElementById('search-input').value;
            const res = await fetch(`/api/items?limited=${mode === 'limited'}&search=${encodeURIComponent(search)}`);
            const data = await res.json();
            
            document.getElementById('asset-grid').innerHTML = data.map(i => `
                <a href="/view/${i.item_id}" class="card">
                    <div class="offline-badge">Offline</div>
                    <img src="${i.thumbnail}">
                    <span class="name">${i.name}</span>
                    <span class="id-tag">#${i.item_id}</span>
                </a>
            `).join('');
        }
        
        fetchItems();
    </script>
</body>
</html>
