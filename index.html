<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polytoria Market Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0d0d0d; color: #efefef; margin: 0; padding: 0; }
        .navbar { background: #141414; padding: 20px 40px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 800; }
        .logo span { color: #007bff; }

        .hero { padding: 60px 20px; text-align: center; }
        .hero h1 { font-size: 40px; font-weight: 800; margin: 0; letter-spacing: -1px; }

        /* Search & Filter Bar */
        .controls { max-width: 800px; margin: 0 auto 40px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .search-container { width: 100%; position: relative; }
        #search-input { width: 100%; background: #141414; border: 1px solid #222; padding: 15px 20px; border-radius: 12px; color: white; font-size: 16px; outline: none; transition: 0.3s; }
        #search-input:focus { border-color: #007bff; box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1); }

        .tabs { display: flex; gap: 10px; }
        .tab-btn { background: #141414; border: 1px solid #222; color: #888; padding: 10px 25px; border-radius: 30px; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .tab-btn.active { background: #fff; color: #000; border-color: #fff; }

        .container { max-width: 1200px; margin: 0 auto 100px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        
        .card { 
            background: #141414; padding: 25px; border-radius: 20px; border: 1px solid #222; 
            text-align: center; text-decoration: none; color: inherit; transition: 0.3s; 
        }
        .card:hover { border-color: #007bff; transform: translateY(-5px); }
        .card img { width: 150px; height: 150px; object-fit: contain; margin-bottom: 15px; background: #0d0d0d; border-radius: 12px; padding: 10px; }
        
        .name { font-weight: 700; font-size: 17px; margin-bottom: 8px; color: #fff; }
        .price { color: #2ecc71; font-weight: 800; font-size: 18px; }
        .badge { display: inline-block; background: #f1c40f; color: #000; font-size: 10px; font-weight: 900; padding: 4px 12px; border-radius: 20px; margin-bottom: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">POLYTORY<span>ANALYTICS</span></div>
    </div>

    <div class="hero">
        <h1>Market Tracker</h1>
    </div>

    <div class="controls">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for items by name..." oninput="handleSearch()">
        </div>
        <div class="tabs">
            <button class="tab-btn active" id="btn-all" onclick="setFilter('all')">All Items</button>
            <button class="tab-btn" id="btn-lim" onclick="setFilter('limited')">Limiteds Only</button>
        </div>
    </div>

    <div class="container">
        <div class="grid" id="market-grid"></div>
    </div>

    <script>
        let currentFilter = 'all';
        let searchQuery = '';
        let searchTimeout;

        function setFilter(type) {
            currentFilter = type;
            document.getElementById('btn-all').classList.toggle('active', type === 'all');
            document.getElementById('btn-lim').classList.toggle('active', type === 'limited');
            fetchData();
        }

        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = document.getElementById('search-input').value;
                fetchData();
            }, 300); // Wait for user to stop typing
        }

        async function fetchData() {
            const isLimited = currentFilter === 'limited';
            const url = `/api/prices?limited=${isLimited}&search=${encodeURIComponent(searchQuery)}`;
            
            const res = await fetch(url);
            const data = await res.json();
            
            const grid = document.getElementById('market-grid');
            if (data.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#666;">No items found matching your search.</p>';
                return;
            }

            grid.innerHTML = data.map(item => `
                <a href="/store/${item.item_id}" class="card">
                    ${item.is_limited || item.rap > 0 ? '<span class="badge">Limited</span>' : '<span class="badge" style="background:#222;color:#555">Standard</span>'}
                    <img src="${item.thumbnail}">
                    <div class="name">${item.name}</div>
                    <div class="price">${item.price.toLocaleString()}</div>
                    <div style="font-size:11px; color:#555; margin-top:5px;">RAP: ${item.rap.toLocaleString()}</div>
                </a>
            `).join('');
        }

        fetchData();
    </script>
</body>
</html>
