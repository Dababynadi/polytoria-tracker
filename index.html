<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Catalog</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; margin: 0; padding: 40px; }
        .container { max-width: 1200px; margin: auto; }
        header { text-align: center; margin-bottom: 50px; }
        h1 { color: #2c3e50; font-size: 2.5em; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        
        .item-card { 
            background: white; 
            border-radius: 18px; 
            padding: 20px; 
            text-align: center; 
            border: 1px solid #e1e8ed; 
            transition: 0.3s; 
            text-decoration: none; 
            color: inherit;
            display: block;
        }
        .item-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-color: #007bff; }
        
        .thumb-bg { background: #f8f9fa; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .item-card img { width: 120px; height: 120px; object-fit: contain; }
        
        .item-name { font-weight: bold; font-size: 1.1em; color: #333; margin-bottom: 8px; height: 2.6em; overflow: hidden; }
        .item-price { color: #27ae60; font-weight: 800; font-size: 1.2em; }
        .item-rap { color: #95a5a6; font-size: 0.85em; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Market Tracker</h1>
            <p>Real-time item values and RAP history</p>
        </header>
        <div class="grid" id="market-grid"></div>
    </div>

    <script>
        async function loadMarket() {
            const res = await fetch('/api/prices');
            const data = await res.json();
            const grid = document.getElementById('market-grid');
            
            grid.innerHTML = data.map(item => `
                <a href="/store/${item.item_id}" class="item-card">
                    <div class="thumb-bg">
                        <img src="${item.thumbnail}" onerror="this.src='https://polytoria.com/assets/img/icon.png'">
                    </div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price.toLocaleString()} Bricks</div>
                    <div class="item-rap">RAP: ${item.rap.toLocaleString()}</div>
                </a>
            `).join('');
        }
        loadMarket();
    </script>
</body>
</html>
