<!DOCTYPE html>
<html>
<head>
    <title>Market Tracker</title>
    <style>
        body { font-family: sans-serif; background: #0b0b0b; color: white; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: #161616; padding: 15px; border-radius: 10px; border: 1px solid #333; text-decoration: none; color: white; }
        .card:hover { border-color: #007bff; }
        .filter-btn { padding: 10px 20px; margin: 10px; cursor: pointer; }
        .active { background: #007bff; color: white; }
    </style>
</head>
<body>
    <h1>Market Tracker</h1>
    <div>
        <button id="btnAll" class="active" onclick="load('all')">All</button>
        <button id="btnLim" onclick="load('limited')">Limiteds</button>
    </div>
    <div class="grid" id="grid"></div>

    <script>
        async function load(mode) {
            document.getElementById('btnAll').className = mode === 'all' ? 'active' : '';
            document.getElementById('btnLim').className = mode === 'limited' ? 'active' : '';
            
            const res = await fetch(mode === 'limited' ? '/api/prices?limited=true' : '/api/prices');
            const data = await res.json();
            const grid = document.getElementById('grid');
            
            if (data.length === 0) {
                grid.innerHTML = "<p>No data. Sync at /internal/update</p>";
                return;
            }

            grid.innerHTML = data.map(i => `
                <a href="/store/${i.item_id}" class="card">
                    <img src="${i.thumbnail}" width="100">
                    <div>${i.name}</div>
                    <div style="color:#2ecc71">${i.price} Bricks</div>
                </a>
            `).join('');
        }
        load('all');
    </script>
</body>
</html>
