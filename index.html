<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polytoria Archive</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0d0d0d; color: #efefef; margin: 0; padding: 0; }
        
        /* Announcement Banner */
        .announcement-banner { background: #007bff; color: white; padding: 12px; text-align: center; font-weight: bold; font-size: 14px; display: none; }

        .navbar { background: #141414; padding: 25px; border-bottom: 1px solid #222; text-align: center; }
        .logo { font-size: 20px; font-weight: 800; }
        .logo span { color: #007bff; }

        .search-container { max-width: 600px; margin: 30px auto; padding: 0 20px; }
        #search-input { width: 100%; padding: 18px; border-radius: 12px; border: 1px solid #222; background: #141414; color: white; font-size: 16px; outline: none; box-sizing: border-box; }

        .container { max-width: 1200px; margin: auto; padding: 0 20px 100px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .card { 
            background: #141414; border: 1px solid #222; border-radius: 16px; padding: 20px; 
            text-align: center; text-decoration: none; color: inherit; transition: 0.2s; position: relative;
        }
        .card:hover { border-color: #444; transform: translateY(-5px); }
        .card img { width: 100%; border-radius: 10px; margin-bottom: 15px; background: #0d0d0d; padding: 10px; box-sizing: border-box; }
        .card .name { font-weight: 700; display: block; margin-bottom: 8px; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .price-tag { color: #2ecc71; font-weight: 800; font-size: 14px; }
        .offsale-tag { color: #ff4444; font-weight: 800; font-size: 13px; text-transform: uppercase; }
        .id-tag { font-size: 10px; color: #444; display: block; margin-top: 8px; }
    </style>
</head>
<body>

    <div id="site-announcement" class="announcement-banner"></div>

    <div class="navbar">
        <div class="logo">POLYTORIA<span>ARCHIVE</span></div>
    </div>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search archive..." oninput="handleSearch()">
    </div>

    <div class="container">
        <div class="grid" id="market-grid"></div>
    </div>

    <script>
        let timer;

        async function init() {
            // Load announcement
            const annRes = await fetch('/api/announcement');
            const annData = await annRes.json();
            if (annData.message) {
                const banner = document.getElementById('site-announcement');
                banner.innerText = annData.message;
                banner.style.display = 'block';
            }
            fetchData();
        }

        function handleSearch() {
            clearTimeout(timer);
            timer = setTimeout(fetchData, 300);
        }

        async function fetchData() {
            const search = document.getElementById('search-input').value;
            const res = await fetch(`/api/prices?search=${encodeURIComponent(search)}`);
            const data = await res.json();
            
            document.getElementById('market-grid').innerHTML = data.map(item => `
                <a href="/store/${item.item_id}" class="card">
                    <img src="${item.thumbnail}">
                    <span class="name">${item.name}</span>
                    ${item.price > 0 
                        ? `<span class="price-tag">${item.price.toLocaleString()} Bricks</span>` 
                        : `<span class="offsale-tag">Off-Sale</span>`}
                    <span class="id-tag">#${item.item_id}</span>
                </a>
            `).join('');
        }

        init();
    </script>
</body>
</html>
